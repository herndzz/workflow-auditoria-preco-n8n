version: '3.8'

services:
  # 🤖 n8n: O cérebro do seu bot de estoque (Único necessário para o Telegram)
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_estoque
    ports:
      - "5678:5678"
    command: start --tunnel
    environment:
      # Segurança via arquivo .env
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      # Ajuste de fuso horário para o Brasil (importante para salvar datas certas no Sheets)
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

# 💾 Declaração dos Volumes (O "Pen Drive" virtual do n8n)
volumes:
  n8n_data: