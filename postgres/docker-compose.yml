services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_estoque
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=SuaSenhaAqui  # Lembre-se de usar uma senha segura
      - POSTGRES_DB=sistema_distribuicao
      - TZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
